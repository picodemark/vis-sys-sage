[project]
name = "vis-sys-sage-backend"
version = "1.0.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi>=0.112.0,<0.113.0",
    "python-multipart>=0.0.20,<0.1.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[dependency-groups]
lint = [
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
indent-style = "space"
quote-style = "single"

[tool.ruff.lint]
fixable = ["ALL"]
select = ["F", "UP", "B", "I", "E"]
